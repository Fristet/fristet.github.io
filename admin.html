<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 관리자</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>📝 포트폴리오 프로젝트 관리</h1>
            <p class="sync-info">✨ 변경사항은 자동으로 저장되며, 메인 페이지를 새로고침하면 즉시 적용됩니다.</p>
            <div class="header-actions">
                <button id="addProjectBtn" class="btn btn-primary">+ 새 프로젝트 추가</button>
                <button id="exportJsonBtn" class="btn btn-secondary">💾 JSON 내보내기</button>
                <button id="refreshMainBtn" class="btn btn-secondary" title="메인 페이지 새 탭에서 열기">🔄 메인 페이지 확인</button>
                <button id="importBtn" class="btn btn-secondary">📂 JSON 가져오기</button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </header>

        <main class="admin-main">
            <div class="projects-list" id="projectsList">
                <!-- 프로젝트 리스트가 여기에 동적으로 생성됩니다 -->
            </div>
        </main>
    </div>

    <!-- 프로젝트 편집 모달 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">프로젝트 편집</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="projectForm">
                    <input type="hidden" id="projectId">
                    
                    <div class="form-group">
                        <label for="projectTitle">프로젝트 제목 *</label>
                        <input type="text" id="projectTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="projectCompany">회사명</label>
                        <input type="text" id="projectCompany" placeholder="예: Epic Games">
                    </div>

                    <div class="form-group">
                        <label for="projectType">프로젝트 타입 *</label>
                        <select id="projectType" required>
                            <option value="">-- 선택하세요 --</option>
                            <option value="professional">🏢 Professional</option>
                            <option value="personal">👤 Personal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="projectDate">날짜</label>
                        <input type="text" id="projectDate" placeholder="예: 2024.01 - 2024.12 또는 2024">
                    </div>

                    <div class="form-group">
                        <label for="projectCategory">카테고리 *</label>
                        <input type="text" id="projectCategory" required placeholder="예: Shader Development">
                    </div>

                    <div class="form-group">
                        <label for="projectDescription">간단한 설명 *</label>
                        <textarea id="projectDescription" rows="2" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="projectTags">태그 (쉼표로 구분)</label>
                        <input type="text" id="projectTags" placeholder="예: Unity, Shader Graph, URP">
                    </div>

                    <div class="form-group">
                        <label for="projectImage">이미지 URL</label>
                        <div class="file-input-group">
                            <input type="text" id="projectImage" placeholder="예: src/images/project.jpg">
                            <button type="button" class="btn btn-small" onclick="document.getElementById('projectImageFile').click()">📁 파일 선택</button>
                            <input type="file" id="projectImageFile" accept="image/*" style="display: none;">
                        </div>
                        <small class="form-hint">파일을 src/images/ 폴더에 넣고 파일명만 선택하세요</small>
                    </div>

                    <div class="form-section">
                        <h3>미디어 갤러리</h3>
                        <p class="form-hint">파일은 src/images/ 또는 src/videos/ 폴더에 넣고 파일명만 선택하세요</p>
                        <div id="mediaList" class="media-list">
                            <!-- 미디어 항목들이 여기에 동적으로 생성됩니다 -->
                        </div>
                        <button type="button" id="addMediaBtn" class="btn btn-small">+ 미디어 추가</button>
                    </div>

                    <div class="form-section">
                        <h3>프로젝트 상세</h3>
                        
                        <div class="form-group">
                            <label for="projectOverview">프로젝트 개요 *</label>
                            <textarea id="projectOverview" rows="3" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>주요 업무</label>
                            <div id="responsibilitiesList" class="list-items">
                                <!-- 업무 항목들이 여기에 동적으로 생성됩니다 -->
                            </div>
                            <button type="button" id="addResponsibilityBtn" class="btn btn-small">+ 업무 추가</button>
                        </div>

                        <div class="form-group">
                            <label for="projectTechnologies">사용 기술 *</label>
                            <input type="text" id="projectTechnologies" required placeholder="예: Unity URP, Shader Graph, HLSL, C#">
                        </div>

                        <div class="form-group">
                            <label for="projectResults">성과</label>
                            <textarea id="projectResults" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">💾 저장</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 코드 출력 모달 -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>생성된 JavaScript 코드</h2>
                <button class="modal-close" id="closeCodeModal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="code-instruction">
                    아래 코드를 복사하여 <strong>script.js</strong> 파일의 <code>const projects = [...]</code> 부분을 교체하세요.
                </p>
                <div class="code-actions">
                    <button id="copyCodeBtn" class="btn btn-primary">📋 코드 복사</button>
                </div>
                <pre id="generatedCode" class="code-output"></pre>
            </div>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
